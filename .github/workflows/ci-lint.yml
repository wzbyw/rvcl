name: ci-lint

# Formatting, license-header, commit-msg, and clang-tidy checks.
# Each lint check runs on the PR diff only; the format and clang-tidy jobs
# check the whole tree on main pushes so a stray unformatted file or finding
# never lands. The commit-msg job validates every commit regardless of which
# files changed, so this workflow deliberately carries no `paths` filter — a
# docs-only PR must still pass the Conventional Commits gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Stop stale runs when a PR is updated; never cancel main's own runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: read-all

jobs:
  clang-format:
    name: clang-format-18
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout rvcl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # On a PR, format only the C/C++ files touched by the diff; on a main
      # push (no base..head), fall back to checking the whole tree so the
      # reformat baseline itself stays green. fetch-depth: 0 above makes the
      # base branch ref (origin/main for a PR) already present. Collect the
      # file list up front and bail out early when no C/C++ files changed (e.g.
      # a docs-only main push) so we skip installing the toolchain for nothing.
      - name: Collect changed files
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE="${GITHUB_BASE_REF}"
            if [ -z "${BASE}" ]; then
              echo "::error::pull_request without base ref" && exit 1
            fi
            git diff --name-only "origin/${BASE}"...HEAD \
                -- '*.c' '*.h' '*.cpp' '*.hpp' > files.txt
          else
            find src include tests examples -type f \
                \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) > files.txt
          fi
          if [ ! -s files.txt ]; then
            echo "no C/C++ files to check"; exit 0
          fi
          echo "Checking:"; cat files.txt

      - name: Install clang-format-18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          # Iterate one path per line so file names containing spaces (or other
          # whitespace) are passed as a single argument rather than word-split.
          # `exit 1` propagates a formatting failure out of the pipeline.
          while IFS= read -r file; do
            clang-format-18 --dry-run --Werror "${file}" || exit 1
          done < files.txt

  # Enforce the unified Apache-2.0 license header (ZTE Corporation + year)
  # on all C/C++ sources, using apache/skywalking-eyes. The header pattern is
  # defined in .github/.licenserc.yml; the license-location-threshold allows
  # the header to sit below the top of the file, so headers and doc blocks
  # can coexist. See .clang-format / .licenserc.yml for the exact template.
  license-header:
    name: license-header
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout rvcl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check license headers
        uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0
        with:
          config: ".github/.licenserc.yml"
          mode: "check"

  # Enforce Conventional Commits on every commit in the PR (base..head) and,
  # on a main push, on the single squash commit that just landed. The PR
  # subject itself is also checked because squash merge makes it the mainline
  # history entry. The script and the rules it applies are documented in
  # CONTRIBUTING.md ("Commit message conventions").
  commit-msg:
    name: commit-msg
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout rvcl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # On a PR, actions/checkout defaults to the synthetic merge ref
          # (refs/pull/N/merge), which makes HEAD a merge commit and would trip
          # the anti-squash-bypass check below. Pin to the real PR head SHA;
          # on push/workflow_dispatch this expression evaluates to empty and
          # checkout falls back to the event's default ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      - name: Check commit messages
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE="${GITHUB_BASE_REF}"
            if [ -z "${BASE}" ]; then
              echo "::error::pull_request without base ref" && exit 1
            fi
            # Squash merge turns the PR title into the mainline subject, so it
            # must satisfy the same rule as a commit subject.
            python3 .github/automation/commit-msg-check.py \
                HEAD "origin/${BASE}" --pr-title "${PR_TITLE}"
          else
            # On a main push only the latest (squash) commit is new, so
            # validate just that commit via HEAD~1..HEAD. origin/main cannot
            # serve as the base: checkout fetches the ref being built, so
            # origin/main is already updated to HEAD and the range would be
            # empty, silently skipping the check.
            python3 .github/automation/commit-msg-check.py HEAD HEAD~1
          fi
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  # Static analysis with clang-tidy-18. The check set is defined in
  # .clang-tidy (bugprone-*, cert-*, readability-* minus the exclusions that
  # are style noise for this C-ABI library). Analysis uses the compile
  # database from a Ninja configure with clang++-18. Like the format job, it
  # runs on the PR diff only (with a whole-tree fallback on main pushes) so a
  # stray finding never lands; any warning/error fails the job (zero-warning
  # tolerance, the oneDNN gate model).
  clang-tidy:
    name: clang-tidy-18
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout rvcl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Collect the C/C++ files to analyze before configuring the build, so a
      # docs-only main push (no C/C++ changes) exits early without spending
      # ~30s generating a compile database. On a PR this is the diff; on a main
      # push it is the whole tree.
      - name: Collect changed files
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE="${GITHUB_BASE_REF}"
            if [ -z "${BASE}" ]; then
              echo "::error::pull_request without base ref" && exit 1
            fi
            git diff --name-only "origin/${BASE}"...HEAD \
                -- '*.c' '*.h' '*.cpp' '*.hpp' > files.txt
          else
            find src include tests examples -type f \
                \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) > files.txt
          fi
          if [ ! -s files.txt ]; then
            echo "no C/C++ files to analyze"; exit 0
          fi
          echo "Analyzing:"; cat files.txt

      - name: Install clang-tidy-18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 clang-18 ninja-build

      # Produce compile_commands.json; analysis needs it to know the exact
      # flags each translation unit is built with. Ninja + the header-only
      # clang-tidy build avoids running the full compiler on every file.
      - name: Configure (compile database)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DRVCL_TEST_SET=ci

      - name: Run clang-tidy-18
        run: |
          # One path per line so file names with spaces are passed as a single
          # argument. `--quiet` keeps the log to findings only; the `|| exit 1`
          # turns any warning/error into a failed job (zero-warning gate).
          while IFS= read -r file; do
            clang-tidy-18 -p build --quiet "${file}" || exit 1
          done < files.txt

  # This job adds a check named "ci-lint" that represents overall workflow
  # status and can be used in branch rulesets.
  status:
    needs: [clang-format, license-header, commit-msg, clang-tidy]
    runs-on: ubuntu-24.04
    name: "ci-lint"
    steps:
      - name: Print success
        run: echo Success
