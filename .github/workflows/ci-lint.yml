name: ci-lint

# Formatting and (later) license-header / commit-msg / clang-tidy checks.
# Each lint check runs on the PR diff only; the format job checks the whole
# tree on main pushes so a stray unformatted file never lands.
on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "CMakeLists.txt"
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "CMakeLists.txt"
  workflow_dispatch:

# Stop stale runs when a PR is updated; never cancel main's own runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: read-all

jobs:
  clang-format:
    name: clang-format-18
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout rvcl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install clang-format-18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      # On a PR, format only the C/C++ files touched by the diff; on a main
      # push (no base..head), fall back to checking the whole tree so the
      # reformat baseline itself stays green. fetch-depth: 0 above makes the
      # base branch ref (origin/main for a PR) already present.
      - name: Check formatting
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE="${GITHUB_BASE_REF}"
            if [ -z "${BASE}" ]; then
              echo "::error::pull_request without base ref" && exit 1
            fi
            FILES=$(git diff --name-only "origin/${BASE}"...HEAD \
                -- '*.c' '*.h' '*.cpp' '*.hpp')
          else
            FILES=$(find src include tests examples -type f \
                \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \))
          fi
          if [ -z "${FILES}" ]; then
            echo "no C/C++ files to check"; exit 0
          fi
          echo "Checking:"; echo "${FILES}"
          # Iterate one path per line so file names containing spaces (or other
          # whitespace) are passed as a single argument rather than word-split.
          # `exit 1` propagates a formatting failure out of the pipeline.
          printf '%s\n' "${FILES}" | while IFS= read -r file; do
            clang-format-18 --dry-run --Werror "${file}" || exit 1
          done

  # Enforce the unified Apache-2.0 license header (ZTE Corporation + year)
  # on all C/C++ sources, using apache/skywalking-eyes. The header pattern is
  # defined in .github/.licenserc.yml; the license-location-threshold allows
  # the header to sit below the top of the file, so headers and doc blocks
  # can coexist. See .clang-format / .licenserc.yml for the exact template.
  license-header:
    name: license-header
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout rvcl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check license headers
        uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0
        with:
          config: ".github/.licenserc.yml"
          mode: "check"

  # This job adds a check named "ci-lint" that represents overall workflow
  # status and can be used in branch rulesets. Later lint jobs (license
  # header, commit message, clang-tidy) join its needs list.
  status:
    needs: [clang-format, license-header]
    runs-on: ubuntu-24.04
    name: "ci-lint"
    steps:
      - name: Print success
        run: echo Success
